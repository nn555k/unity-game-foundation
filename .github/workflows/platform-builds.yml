name: Platform Compile Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target platform
        required: true
        type: choice
        options:
          - Android
          - iOS

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.target == 'iOS' && 'macos-15' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build validation player
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f2c1
          targetPlatform: ${{ inputs.target }}
          buildName: FoundationValidation
          buildsPath: Builds
          cacheUnityInstallationOnMac: true

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foundation-${{ inputs.target }}
          path: Builds
